# Base-game demand growth-profile registry.
#
# This file is the shipped source of truth for private-building growth tuning.
# In v0.1, the shipped set is intentionally small and closed: one default
# GrowthProfile per shipped baseline private-use family and density.
#
# Baseline v0.1 keeps local modifiers neutral by default. The shipped profiles
# therefore rely on city-level demand pressure, thresholds, and hysteresis only.
[signal_normalization]
resident_presence_saturation_residents = 500
household_affordability_target_reserve_days = 7.0
household_stock_stability_target_days = 3.0
[action_budget]
max_households_per_day = 48
[household_action]
base_inflow = 1.0
admission_threshold = 0.10
removal_threshold = 0.55
[action_budget.spawn_batch_fraction_by_use]
residential = 0.50
commercial = 0.40
industrial = 0.40

[action_budget.upgrade_batch_fraction_by_use]
residential = 0.25
commercial = 0.25
industrial = 0.25

[action_budget.downgrade_batch_fraction_by_use]
residential = 0.25
commercial = 0.25
industrial = 0.25

[action_budget.despawn_batch_fraction_by_use]
residential = 0.50
commercial = 0.50
industrial = 0.50
[[profiles]]
id = "residential_low_default"
demand_channel = "ResidentialGrowth"
cadence_days = 1
base_pressure_weight = 1.0
local_modifier_scale = 0.0
spawn_threshold = 0.55
despawn_threshold = 0.20
upgrade_threshold = 0.80
downgrade_threshold = 0.30
hysteresis_margin = 0.05
