# Portable geometry fixture: level house/entrance, frontage driveway and asphalt yard.
# No installed asset pack or Godot mesh is needed by the Rust geometry tests.
asset_id = "building.residential.graded_yard"
display_name = "Graded yard regression"
[building]
placement_mode = "zoned_private"
zone_type = "residential"
density = "low"
lot_width_cells = 2
lot_depth_cells = 2
frontage_forward = [0, 0, -1]
household_capacity = 6
flat_size_m2 = 80
[[mesh_parts]]
name = "house"
position = [0, 0, 2]
scale = 7
[[anchors]]
type = "entrance"
name = "main"
position = [0, 0, -3]
forward = [0, 0, -1]
[[anchors]]
type = "driveway"
name = "driveway"
position = [0, 0, -10]
forward = [0, 0, 1]
width_m = 3
[[site_surfaces]]
name = "front_yard"
material = "asphalt"
y_m = 0.01
vertices = [[-10, -10], [10, -10], [10, -3.5], [-10, -3.5]]
