; ========================================================================
;  Custom fields for the Manifest Headers addon.
;
;  Anything named in custom_fields is written into every header the tool
;  touches, after the base fields. Anything named in list_fields is
;  rendered as [a, b, c] rather than a bare value. Values in [defaults]
;  seed a field when a file has no header yet; an existing value always
;  wins, because this standardises headers rather than overwriting them.
; ========================================================================

[manifest]

api_version="metrum-v1.0.0"
custom_fields=[]
list_fields=[]

[defaults]
