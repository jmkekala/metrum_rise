[package]
name = "metrum_rise"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.4.5", features = ["experimental-threads"] }
rand = "0.8"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
cavalier_contours = "0.7"
glam = "0.30"
i_overlay = "5.0"
parry2d = { version = "0.26", features = ["enhanced-determinism"] }
rstar = "0.12"
soa_derive = "0.14"
spade = "2.15"
splines = { version = "5.0", features = ["glam"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = 1

[profile.test]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true

[[bench]]
name = "agent_benchmark"
harness = false

[[bench]]
name = "surface_benchmark"
harness = false
