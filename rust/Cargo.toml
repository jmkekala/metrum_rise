[package]
name = "metrum_rise"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.4.5", features = ["experimental-threads"] }
rand = "0.8"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
foldhash = "0.2"
glam = "0.30"
i_overlay = "5.0"
imbl = "7.0.0"
parry2d = { version = "0.26", features = ["enhanced-determinism"] }
rstar = "0.12"
# Exact orientation predicates (already built for spade), so the junction core check agrees
# with the constrained triangulation that consumes the loop.
robust = "1.2"
soa_derive = "0.14"
spade = "2.15"
splines = { version = "5.0", features = ["glam"] }
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = 1

[profile.test]
opt-level = 1
# Line tables only: backtraces keep files and lines, without full variable info, which cost
# compile time and 22-25 GB per test build (2026-10-26). Release builds keep `debug = 1`.
debug = "line-tables-only"
# No ThinLTO across the test build's codegen units (on by default at opt-level 1). It took 41-69 s
# of the 66-104 s a test build needed after a one-line edit, because an edit spread through the
# imports to 22-43 of 256 units; without it one unit is rebuilt and the build takes about 13 s,
# peaking at 4.7 instead of 11.6 GB (compile round K0, `CODE-27`, 2026-11-09). The cost: test code
# runs 15-20% slower without the cross-unit inlining. Floating-point results do not change.
lto = "off"
debug-assertions = true
overflow-checks = true

[[bench]]
name = "agent_benchmark"
harness = false

[[bench]]
name = "road_chunk_benchmark"
harness = false

[[bench]]
name = "roadbed_benchmark"
harness = false

[[bench]]
name = "asset_lod_benchmark"
harness = false

[[bench]]
name = "economy_tick_benchmark"
harness = false

[[bench]]
name = "roadbed_layout_benchmark"
harness = false
