[package]
name = "metrum_rise"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.4.5", features = ["experimental-threads"] }
rand = "0.8"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
rstar = "0.12"
soa_derive = "0.14"
spade = "2.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = 1

[[bench]]
name = "agent_benchmark"
harness = false
